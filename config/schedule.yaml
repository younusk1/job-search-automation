version: 1
timezone: Asia/Karachi
schedule:
  kind: github_actions_schedule
  cron: "0 3 * * 3"
  description: Run once every Wednesday at 08:00 Asia/Karachi (03:00 UTC).
execution:
  pipeline: [discovery, intelligence, summary, email]
  execution_mode: sequential
  weekly_runs: 1
  polling: disabled
  loop_after_completion: false
completion:
  success_condition: email_provider_confirms_delivery
  on_success: workflow ends until next scheduled Wednesday
  state_file: data/run-state.json
