version: 1
timezone: Asia/Karachi
schedule:
  kind: azure_timer_trigger
  cron: "0 0 8 * * 3"
  description: Run once every Wednesday at 08:00 Asia/Karachi; configure Azure timezone support or convert to matching UTC.
execution:
  pipeline: [discovery, intelligence, summary, email]
  execution_mode: sequential
  weekly_runs: 1
  polling: disabled
  loop_after_completion: false
completion:
  success_condition: email_provider_confirms_delivery
  on_success: mark_run_complete_until_next_scheduled_wednesday
  state_file: data/run-state.json
