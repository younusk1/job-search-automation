name: Weekly job digest

on:
  schedule:
    # 03:00 UTC = 08:00 Asia/Karachi (Pakistan has no DST).
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate required GitHub configuration
        shell: bash
        env:
          JOB_SOURCE_FEEDS: ${{ vars.JOB_SOURCE_FEEDS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOB_DIGEST_TO: ${{ secrets.JOB_DIGEST_TO }}
          JOB_DIGEST_FROM: ${{ secrets.JOB_DIGEST_FROM }}
        run: |
          missing=()
          [ -n "${JOB_SOURCE_FEEDS:-}" ] || missing+=("JOB_SOURCE_FEEDS")
          [ -n "${RESEND_API_KEY:-}" ] || missing+=("RESEND_API_KEY")
          [ -n "${JOB_DIGEST_TO:-}" ] || missing+=("JOB_DIGEST_TO")
          [ -n "${JOB_DIGEST_FROM:-}" ] || missing+=("JOB_DIGEST_FROM")

          echo "GitHub configuration check:"
          echo "- JOB_SOURCE_FEEDS: ${JOB_SOURCE_FEEDS:+set}"
          echo "- RESEND_API_KEY: ${RESEND_API_KEY:+set}"
          echo "- JOB_DIGEST_TO: ${JOB_DIGEST_TO:+set}"
          echo "- JOB_DIGEST_FROM: ${JOB_DIGEST_FROM:+set}"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub configuration: ${missing[*]}"
            echo "Add the repository variable JOB_SOURCE_FEEDS and secrets RESEND_API_KEY, JOB_DIGEST_TO, and JOB_DIGEST_FROM, then rerun the workflow."
            exit 1
          fi
      - name: Collect Pakistan-first candidate leads
        env:
          JOB_SOURCE_FEEDS: ${{ vars.JOB_SOURCE_FEEDS }}
        run: python collect_jobs.py
      - name: Verify official vacancy pages
        run: python verify_jobs.py
      - name: Generate and send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOB_DIGEST_TO: ${{ secrets.JOB_DIGEST_TO }}
          JOB_DIGEST_FROM: ${{ secrets.JOB_DIGEST_FROM }}
        run: python job_digest.py
      - name: Upload generated digest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-job-digest
          path: data/
          if-no-files-found: ignore
